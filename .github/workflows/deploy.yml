name: Build and deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permet un re-declenchement manuel sans commit factice

permissions:
  id-token: write # requis pour l'auth OIDC vers AWS (pas de cles d'acces stockees)
  contents: read

# Empeche deux deploiements concurrents de tourner en meme temps sur la meme
# instance EC2 (deux `docker rm`/`docker run` qui s'entrelacent, ou deux
# ecritures concurrentes du meme fichier backend.env, laisseraient l'etat final
# imprevisible). File d'attente plutot qu'annulation : on ne veut pas qu'un
# deploiement soit coupe en plein `docker run`.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_BACKEND }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # Pas de kubectl/ALB ici : un seul EC2 free-tier tourne les conteneurs
      # directement. Le deploiement = demander a l'instance de se re-pull elle
      # meme la nouvelle image via SSM Run Command (pas de SSH).
      - name: Deploy via SSM Run Command
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Juste apres un `terraform apply`, l'instance peut mettre 1-2 min a
          # s'enregistrer aupres de SSM : on retente plutot que d'echouer tout
          # de suite sur un "InvalidInstanceId" qui n'a rien a voir avec le deploiement.
          COMMAND_ID=""
          for i in $(seq 1 10); do
            if COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[\"/opt/quincaillerie/deploy-backend.sh $IMAGE_TAG\"]" \
              --query "Command.CommandId" --output text 2>/tmp/ssm-error.log); then
              break
            fi
            echo "send-command attempt $i/10 failed, retrying in 15s (instance may still be registering with SSM):"
            cat /tmp/ssm-error.log
            sleep 15
          done

          if [ -z "$COMMAND_ID" ]; then
            echo "::error::aws ssm send-command did not succeed after 10 attempts"
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_ENV"

          # `aws ssm wait command-executed` uses a fixed ~100s polling budget
          # by default, which can be shorter than deploy-backend.sh's own
          # health-check window (up to ~120s) -- it could time out and fail
          # the job even on a perfectly successful deploy. Polling explicitly
          # instead, sized to comfortably exceed the remote script's worst case.
          STATUS="Pending"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
            sleep 10
          done

          echo "Remote script status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

      - name: Show remote script output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output text
