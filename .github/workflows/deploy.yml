name: Build and deploy backend

on:
  push:
    branches: [main]

permissions:
  id-token: write # requis pour l'auth OIDC vers AWS (pas de cles d'acces stockees)
  contents: read

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_BACKEND }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # Pas de kubectl/ALB ici : un seul EC2 free-tier tourne les conteneurs
      # directement. Le deploiement = demander a l'instance de se re-pull elle
      # meme la nouvelle image via SSM Run Command (pas de SSH).
      - name: Deploy via SSM Run Command
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"/opt/quincaillerie/deploy-backend.sh $IMAGE_TAG\"]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_ENV"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

      - name: Show remote script output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output text
