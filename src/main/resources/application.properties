spring.application.name=quincaillerie-backend

# --- Base de donnees ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/quincaillerie_mvogt?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Le schema est gere par Flyway, Hibernate ne doit pas le modifier automatiquement.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Serveur ---
server.port=${SERVER_PORT:8080}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:changeme-dev-secret-please-override-in-production-min-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- CORS (utilise par SecurityConfig) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# --- Actuator (verification manuelle de sante : curl /actuator/health) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
